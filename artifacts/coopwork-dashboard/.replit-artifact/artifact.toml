kind = "web"
previewPath = "/"
title = "CoopWork"
description = "A role-based cooperative services dashboard for customers, workers, and cooperative administrators to manage bookings, availability, reviews, complaints, and earnings."
version = "1.0.0"
id = "artifacts/coopwork-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22206

[services.development]
run = "pnpm --filter @workspace/coopwork-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coopwork-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/coopwork-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22206"
BASE_PATH = "/"
